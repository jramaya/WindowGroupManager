; config.example.ini
; Minimal example configuration for WindowGroupManager.
; Copy this file to `config.ini` and adapt paths/hotkeys to your system.
; Format for each section:
; [SectionName]
; GroupName=SomeGroup
; WinTitle=ahk_exe process.exe     ; AutoHotkey window search criterion
; Path=path_or_command_to_launch     ; command used to start the app if no window exists
; Hotkey=#1                          ; hotkey to cycle this group (example: # = Win)

[Chrome]
GroupName=ChromeGroup
WinTitle=ahk_exe chrome.exe
Path=chrome.exe
Hotkey=#g

[Editor]
GroupName=Editors
WinTitle=ahk_exe code.exe
Path=code
Hotkey=#s

; Optional: add your own custom groups below. Example:
; [Terminal]
; GroupName=Terminals
; WinTitle=ahk_exe alacritty.exe
; Path=alacritty
; Hotkey=#3
